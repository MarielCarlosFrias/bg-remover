name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-image-formats-plugins
      - name: Prepare ONNX Runtime and model (com retry)
        run: |
          # O file(DOWNLOAD) do CMake nao repete tentativas, e o GitHub ja
          # devolveu HTTP/2 PROTOCOL_ERROR neste projeto. Descarregamos
          # aqui, com retry, para o caminho default que o CMakeLists ja
          # procura (evita a descarga interna do CMake).
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz
          echo '8627cae49b51544ed15bb70c8ecf25b187f22a301c99c1ced5f4f3af5c36b44c  /tmp/ort.tgz' | sha256sum --check
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | sha256sum --check
      - run: cmake -S . -B build -G Ninja -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON -DBG_REMOVER_BUNDLE_MODELS=ON
      - run: cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -G DEB -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/*.deb

  linux-appimage:
    # Mesmo runner do DEB: o Ubuntu 22.04 tem Qt 6.2/CMake 3.22 e o
    # configure falha; a compatibilidade de glibc do 24.04 cobre a
    # grande maioria das distros ativas.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-image-formats-plugins file
      - name: Prepare ONNX Runtime and model (com retry)
        run: |
          # O file(DOWNLOAD) do CMake nao repete tentativas, e o GitHub ja
          # devolveu HTTP/2 PROTOCOL_ERROR neste projeto. Descarregamos
          # aqui, com retry, para o caminho default que o CMakeLists ja
          # procura (evita a descarga interna do CMake).
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-linux-x64-1.19.0.tgz
          echo '8627cae49b51544ed15bb70c8ecf25b187f22a301c99c1ced5f4f3af5c36b44c  /tmp/ort.tgz' | sha256sum --check
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | sha256sum --check
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DINSTALLED=ON \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON \
            -DBG_REMOVER_BUNDLE_MODELS=ON
          cmake --build build --parallel
      - name: Test
        # Testar antes de empacotar: um binario que falha nos testes
        # nao deve chegar ao AppImage publicado.
        run: ctest --test-dir build --output-on-failure
      - name: Install into AppDir
        run: DESTDIR=appdir cmake --install build
      - name: Build AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          mv linuxdeploy*.AppImage /tmp/
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE=/usr/bin/qmake6
          export VERSION="${GITHUB_REF_NAME#v}"
          export UPDATE_DESKTOP_FILE=1
          /tmp/linuxdeploy-x86_64.AppImage --appdir appdir \
            -e appdir/usr/bin/bg_remover_gui \
            -e appdir/usr/bin/bg_remover_cli \
            -i appdir/usr/share/icons/hicolor/scalable/apps/bg-remover.svg \
            -d appdir/usr/share/applications/bg-remover.desktop \
            --plugin qt --output appimage
          mv *.AppImage "bg-remover_${VERSION}_amd64.AppImage"
          ls -la bg-remover_*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: bg-remover_*_amd64.AppImage

  windows-zip:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install aqt (pip)
        shell: pwsh
        run: |
          python -m pip install aqtinstall

      - name: Download Qt 6.7.3 (aqt)
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -O Qt
          $qtDir = "$PWD\Qt\6.7.3\msvc2019_64"
          Add-Content $env:GITHUB_PATH "$qtDir\bin"
          "CMAKE_PREFIX_PATH=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Download bundled model
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx -OutFile u2netp.onnx
          if ((Get-FileHash u2netp.onnx -Algorithm SHA256).Hash.ToLower() -ne '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8') { throw 'Checksum do modelo invalido' }
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON -DBG_REMOVER_BUNDLE_MODELS=ON
      - run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/*.zip

  macos-zip:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install aqt and Qt 6.7.3
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install --quiet aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop 6.7.3 clang_64 -O Qt
          # O aqt pode usar "macos" ou "clang_64" como pasta da
          # arquitetura; localizamos o binario e derivamos a raiz.
          MACDEPLOYQT="$(find "$PWD/Qt" -name macdeployqt -type f -print -quit)"
          test -n "$MACDEPLOYQT"
          QT_DIR="$(dirname "$(dirname "$MACDEPLOYQT")")"
          echo "QT_DIR=$QT_DIR" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT_DIR" >> "$GITHUB_ENV"
          echo "$QT_DIR/bin" >> "$GITHUB_PATH"
      - name: Prepare ONNX Runtime and model
        run: |
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.19.0/onnxruntime-osx-universal2-1.19.0.tgz
          echo 'a40293ad13c166289a83b072421faa7883b5ae4694ad93d6445ac32bd08be6ab  /tmp/ort.tgz' | shasum -a 256 -c -
          tar -xzf /tmp/ort.tgz
          curl -fL --http1.1 --retry 5 --retry-delay 3 --retry-all-errors \
            -o u2netp.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  u2netp.onnx' | shasum -a 256 -c -
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DINSTALLED=ON -DBG_REMOVER_FETCH_ONNX_RUNTIME=ON \
            -DBG_REMOVER_BUNDLE_MODELS=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_INSTALL_PREFIX="$PWD/dist"
          cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and deploy bundle
        run: |
          cmake --install build
          APP=dist/bg_remover_gui.app
          "$QT_DIR/bin/macdeployqt" "$APP" -always-overwrite \
            -executable="$APP/Contents/MacOS/bg_remover_cli"
      - name: Verify and package
        run: |
          APP=dist/bg_remover_gui.app
          test -x "$APP/Contents/MacOS/bg_remover_gui"
          test -x "$APP/Contents/MacOS/bg_remover_cli"
          test -f "$APP/Contents/Resources/u2netp.onnx"
          test -f "$APP/Contents/Frameworks/libonnxruntime.dylib"
          otool -L "$APP/Contents/MacOS/bg_remover_gui" | grep -q onnxruntime
          otool -L "$APP/Contents/MacOS/bg_remover_cli" | grep -q onnxruntime
          otool -L "$APP/Contents/MacOS/bg_remover_cli" | grep -q '@executable_path/../Frameworks'
          ! otool -L "$APP/Contents/MacOS/bg_remover_gui" | grep -q "$QT_DIR"
          ! otool -L "$APP/Contents/MacOS/bg_remover_cli" | grep -q "$QT_DIR"
          "$APP/Contents/MacOS/bg_remover_cli" --version
          codesign --force --deep --sign - "$APP"
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "$APP" "bg-remover_${VERSION}_macos_universal2.zip"
          ls -lh bg-remover_*_macos_universal2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: bg-remover_*_macos_universal2.zip

  publish:
    needs: [linux-deb, linux-appimage, windows-zip, macos-zip]
    # Publica o que existir mesmo que um job falhe: uma falha isolada
    # (ex.: AppImage) nao deve custar a release inteira. Foi o que
    # aconteceu na v1.0.1, com DEB e ZIP prontos e nunca publicados.
    if: ${{ always() && !cancelled() && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        # Um unico SHA256SUMS cobre todos os pacotes publicados; e o
        # ficheiro que os utilizadores usam para verificar downloads.
        working-directory: dist
        run: |
          sha256sum bg-remover_* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/**/*
          generate_release_notes: true
