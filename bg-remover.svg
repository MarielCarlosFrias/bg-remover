    <g fill="#e8edf0">
      <rect x="4" y="4" width="15" height="15"/>
      <rect x="34" y="4" width="15" height="15"/>
      <rect x="64" y="4" width="15" height="15"/>
      <rect x="94" y="4" width="15" height="15"/>
      <rect x="19" y="19" width="15" height="15"/>
      <rect x="49" y="19" width="15" height="15"/>
      <rect x="79" y="19" width="15" height="15"/>
      <rect x="109" y="19" width="15" height="15"/>
      <rect x="4" y="34" width="15" height="15"/>
      <rect x="34" y="34" width="15" height="15"/>
      <rect x="64" y="34" width="15" height="15"/>
      <rect x="94" y="34" width="15" height="15"/>
      <rect x="19" y="49" width="15" height="15"/>
      <rect x="49" y="49" width="15" height="15"/>
      <rect x="79" y="49" width="15" height="15"/>
      <rect x="109" y="49" width="15" height="15"/>
      <rect x="4" y="64" width="15" height="15"/>
      <rect x="34" y="64" width="15" height="15"/>
      <rect x="64" y="64" width="15" height="15"/>
      <rect x="94" y="64" width="15" height="15"/>
      <rect x="19" y="79" width="15" height="15"/>
      <rect x="49" y="79" width="15" height="15"/>
      <rect x="79" y="79" width="15" height="15"/>
      <rect x="109" y="79" width="15" height="15"/>
      <rect x="4" y="94" width="15" height="15"/>
      <rect x="34" y="94" width="15" height="15"/>
      <rect x="64" y="94" width="15" height="15"/>
      <rect x="94" y="94" width="15" height="15"/>
      <rect x="19" y="109" width="15" height="15"/>
      <rect x="49" y="109" width="15" height="15"/>
      <rect x="79" y="109" width="15" height="15"/>
      <rect x="109" y="109" width="15" height="15"/>
