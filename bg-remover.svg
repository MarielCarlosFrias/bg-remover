    <!-- silhueta de retrato, recortada -->
    <g fill="#0d5c63">
      <circle cx="64" cy="52" r="20"/>
      <path d="M28 128 C28 96 44 78 64 78 C84 78 100 96 100 128 Z"/>
    </g>

    <!-- linha tracejada de "selecao" ao redor da silhueta -->
    <path d="M28 128 C28 96 44 78 64 78 C84 78 100 96 100 128"
          fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-dasharray="5 4" opacity="0.85"/>
    <circle cx="64" cy="52" r="20" fill="none" stroke="#ffffff"
            stroke-width="2.5" stroke-dasharray="5 4" opacity="0.85"/>
  </g>
</svg>
